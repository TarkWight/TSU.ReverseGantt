[package]
name = "backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Arsentiy Gonda"]

[dependencies]
axum = { version = "0.8.7", features = ["macros", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
dotenvy = "0.15.7"
anyhow = "1.0.100"
thiserror = "2.0.17"
serde_json = "1.0.145"
async-trait = "0.1.89"
tower-http = { version = "0.6.7", features = ["cors"] }
argon2 = "0.5.3"
password-hash = "0.5.0"
jsonwebtoken = "9.3.1"
rand_core = "0.6.4"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
http = "1.3"

#[dev-dependencies]
#mockall = "0.13"
#axum-test = "16"
#tower = { version = "0.5", features = ["util"] }
#once_cell = "1.20"
#serial_test = "3.2"
