<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Toggle Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <h2 class="text-center mb-4">Password Toggle Test</h2>
                        <form>
                            <div class="mb-3">
                                <label for="test-password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="test-password" placeholder="Enter password">
                            </div>
                            <div class="mb-3">
                                <label for="test-password-confirm" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="test-password-confirm" placeholder="Confirm password">
                            </div>
                            <button type="button" class="btn btn-primary" onclick="initToggles()">Initialize Toggles</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const app = {
            initPasswordToggle(inputId) {
                const input = document.getElementById(inputId);
                if (!input) return;

                const container = input.parentElement;
                if (container.querySelector('.password-toggle-btn')) {
                    return;
                }
                
                if (!container.classList.contains('password-input-container')) {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'password-input-container position-relative';
                    input.parentNode.insertBefore(wrapper, input);
                    wrapper.appendChild(input);
                    
                    const toggleBtn = document.createElement('button');
                    toggleBtn.type = 'button';
                    toggleBtn.className = 'btn btn-sm password-toggle-btn';
                    toggleBtn.innerHTML = '<i class="bi bi-eye"></i>';
                    toggleBtn.setAttribute('aria-label', 'Toggle password visibility');
                    toggleBtn.onclick = () => this.togglePasswordVisibility(inputId);
                    wrapper.appendChild(toggleBtn);
                } else {
                    const toggleBtn = document.createElement('button');
                    toggleBtn.type = 'button';
                    toggleBtn.className = 'btn btn-sm password-toggle-btn';
                    toggleBtn.innerHTML = '<i class="bi bi-eye"></i>';
                    toggleBtn.setAttribute('aria-label', 'Toggle password visibility');
                    toggleBtn.onclick = () => this.togglePasswordVisibility(inputId);
                    container.appendChild(toggleBtn);
                }
            },

            togglePasswordVisibility(inputId) {
                const input = document.getElementById(inputId);
                if (!input) return;

                const container = input.parentElement;
                const toggleBtn = container.querySelector('.password-toggle-btn');
                const icon = toggleBtn.querySelector('i');

                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'bi bi-eye-slash';
                    toggleBtn.setAttribute('aria-label', 'Hide password');
                } else {
                    input.type = 'password';
                    icon.className = 'bi bi-eye';
                    toggleBtn.setAttribute('aria-label', 'Show password');
                }
            }
        };

        function initToggles() {
            app.initPasswordToggle('test-password');
            app.initPasswordToggle('test-password-confirm');
        }

        window.addEventListener('DOMContentLoaded', initToggles);
    </script>
</body>
</html>
